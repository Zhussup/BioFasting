name: CI

# The per-push signal: does it build, on which interpreters, and do the tests
# pass.  Wheels are a separate, tag-triggered workflow -- see wheels.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          # One arm64 job.  The wheel matrix covers arm64 properly on a tag, but
          # a compile error is far cheaper to read here than inside a
          # cibuildwheel log.
          - { os: macos-14, python: "3.13" }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the test runner
        run: python -m pip install --upgrade pip pytest

      - name: Build and install
        # Build isolation is left ON on purpose: this is the job that proves
        # build-system.requires in pyproject.toml is complete.  A missing cmake
        # or ninja in that list would only ever show up in a stranger's clean
        # environment, which is exactly the failure this step exists to catch.
        #
        # Non-editable, too: a wheel install is what a user gets, and the
        # editable one takes a different code path in scikit-build-core.
        run: python -m pip install .

      - name: Test
        run: python -m pytest -v

  werror:
    # Own sources only -- nanobind's are compiled into the same target and are
    # exempt, so a nanobind patch release cannot turn into our build failure.
    name: warnings are errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the test runner
        run: python -m pip install --upgrade pip pytest

      - name: Build with warnings as errors
        run: python -m pip install .
        env:
          CMAKE_ARGS: -DBIOFASTING_WERROR=ON

      - name: Test
        run: python -m pytest -v
