[build-system]
# cmake and ninja are listed here, not only in requirements-dev.txt, so that a
# plain `pip install .` works on a bare machine.  nanobind 3.x sets the Python
# floor at 3.10, which is why requires-python below says 3.10 and not 3.9.
requires = [
    "scikit-build-core>=1.1,<2",
    "nanobind>=3.1,<4",
    "cmake>=3.15",
    "ninja",
]
build-backend = "scikit_build_core.build"

[project]
name = "biofasting"
version = "0.0.1"
description = "A C/C++-backed core for sequence bioinformatics, built to close the hot-path gap Biopython leaves open."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zhussup" }]
keywords = ["bioinformatics", "fastq", "fasta", "sequence", "performance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# One runtime dependency, and it arrives with the zero-copy views it exists
# for: open_fasta_grid()/open_fastq_grid() return numpy arrays, so the package
# that offers them cannot be installed without it.  Nothing else here needs
# numpy -- the readers, the sequence ops and every kernel are pure C++ -- and
# nothing imports it until a view is asked for, so it is a dependency of the
# API surface rather than of the import.
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
# The pairwise aligner (biofasting.alignment) runs Biopython's scoring scheme on
# parasail's SIMD kernels.  Optional, not required, for a packaging reason that
# was checked rather than assumed: parasail 1.3.4 on PyPI ships six files --
# manylinux_2_17 x86_64, macosx_10_9 x86_64, musllinux_1_1 i686, win32,
# win_amd64 and the sdist -- and no aarch64 wheel of any kind, while
# [tool.cibuildwheel] below builds an aarch64 wheel on Linux and on macos-14.  A
# required dependency would turn every one of those jobs into a source build of
# parasail.  The accelerator is therefore opt-in, and its measured 6x-35x is
# honestly an x86-64 number.
alignment = ["parasail>=1.3.4"]
# The Arrow tables (biofasting.arrow) need pyarrow to hand their buffers to, and
# nothing else here does: `read_fastq_table` builds Arrow's layout in C++ and
# `Array.from_buffers` wraps it, so pyarrow is the reader of the result rather
# than a dependency of the readers.  Optional for the same reason as alignment
# but a different one: a wheel that required pyarrow would push an 40 MB
# dependency on every caller who only ever wanted to parse a FASTQ file.  It is
# not pinned to a version -- the buffers are a format, not an API, and pyarrow
# has read this layout since 0.15.
arrow = ["pyarrow>=15"]

[project.urls]
Repository = "https://github.com/Zhussup/BioFasting"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.15"
cmake.build-type = "Release"
# The {state} segment is not cosmetic.  Without it a plain `python -m build` --
# which uses its own cmake and ninja from a temporary environment that is
# deleted the moment it finishes -- and the editable rebuild-on-import share a
# single build directory.  Whichever runs second then finds a CMake cache
# pointing at a toolchain that no longer exists, and the rebuild dies with
# "build tool execution failed".  That is how this was found, not by reading
# documentation.  Distinct directories, distinct toolchains, no collision, and
# the wheel build stays safe to run while an editable install is in place.
build-dir = "build/{state}/{wheel_tag}"
wheel.packages = ["src/biofasting"]

# Default inclusion mode: walk the tree, skip whatever .gitignore ignores.  The
# sdist.include list that used to be here is deliberately gone.  In the default
# mode an include pattern is tested BEFORE the exclude rules, so `src/**` quietly
# pulled __pycache__/*.pyc into the archive -- bytecode tied to one interpreter
# and one pytest version, shipped to machines that have neither.  .gitignore
# already knows what does not belong, and it is maintained anyway, so a second
# list of the same thing was only ever going to disagree with the first.
sdist.exclude = [
    # Committed and useful for a reader, but multi-megabyte, and a downstream
    # packager has no use for an inventory of Biopython's API.
    "inventory/*.csv",
    "inventory/*.json",
    # The README's images.  They are 1.7 MB of the 1.9 MB archive -- the banner
    # GIF alone is 1.3 MB -- and they buy nothing: PyPI renders a long
    # description from absolute URLs, so these relative links are broken on the
    # project page whether or not the files travel with the source.  The charts
    # are regenerable from bench/*.py by anyone who wants them.
    "misc",
]

# Recompile the extension when a C++ source changes, so the edit/test loop is
# `pytest` and nothing else.  This needs cmake and ninja importable in the
# environment, which requirements-dev.txt provides.
editable.rebuild = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.cibuildwheel]
# Wheels are built on tags and on demand, never on every push: this matrix is
# 4 interpreters x (manylinux, musllinux) x (x86_64, aarch64) on Linux plus 4
# macOS arm64 wheels, and half the Linux ones run under QEMU.  That is far more
# than a per-push correctness signal is worth; ci.yml is the per-push signal.
#
# musllinux is kept.  It is cibuildwheel's default, and Alpine is a common base
# for bioinformatics containers, so dropping it would cut off real users to save
# CI minutes on a job that only runs on a tag.
build = "cp310-* cp311-* cp312-* cp313-*"
test-requires = ["pytest"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
